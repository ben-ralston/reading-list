[project]
name = "substack-progress-sync"
version = "0.1.0"
description = "Hourly Substack read-progress sync → /api/sync webhook (reading-list #192)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["substack_progress_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
