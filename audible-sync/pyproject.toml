[project]
name = "audible-sync"
version = "0.1.0"
description = "Daily Audible audiobook progress sync → /api/sync webhook (reading-list #42)"
requires-python = ">=3.11"
dependencies = [
    "audible>=0.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audible_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
